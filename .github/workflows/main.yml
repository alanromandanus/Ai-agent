
name: Build NEXA AI HUB APK

on:
  workflow_dispatch:
  push:
    branches:
      - utama

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil file proyek
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ekstrak proyek NEXA
        run: |
          mkdir source
          unzip -q nexa-ai-hub-v0.4-cloud-build.zip -d source
          cd source/nexa-ai-hub-v0.3-android
          npm install
          npx cap add android
          npx cap sync android

      - name: Buat APK
        run: |
          cd source/nexa-ai-hub-v0.3-android/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-AI-HUB-APK
          path: source/nexa-ai-hub-v0.3-android/android/app/build/outputs/apk/debug/app-debug.apk
